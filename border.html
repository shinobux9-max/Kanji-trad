<!-- Conteneur global avec l'image -->
<div class="card-wrapper">
  <div class="card">
    <div class="jp reading">いくら</div>
    <div class="jp word">いくら</div>
    <div class="romaji">Ikura</div>
    <div class="type-badge">ADVERBE / PRONOM · QUANTITÉ</div>
    <div class="speak-btn">🔊</div>
    <div class="reflection-bottom"></div>
  </div>
</div>

<style>
  @property --angle {
    syntax: "<angle>";
    initial-value: 0deg;
    inherits: false;
  }

  body {
    background: #060B18;
    color: #F0F6FC;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    margin: 0;
    font-family: 'Inter', sans-serif;
  }

/* Conteneur de l'image de fond */
  .card-wrapper {
    width: 340px;
    height: 200px;
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    background-image: url('');
    background-size: cover;
    background-position: center;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
  }

  /* La carte en verre */
  .card {
    position: absolute;
    inset: 0;
    padding: 26px 20px 22px;
    text-align: center;
    z-index: 1;

    /* Voile de verre avec une lueur lumineuse interne centrée en haut */
    background: 
      radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.22), transparent 70%),
      linear-gradient(135deg, rgba(15, 25, 45, 0.4), rgba(5, 10, 20, 0.6));
      
    /* Blur baissé à 6px pour un effet vitre subtil */
    backdrop-filter: blur(6px) saturate(150%);
    -webkit-backdrop-filter: blur(6px) saturate(150%);

    /* Bordure nette et ombre interne pour l'effet de creux/épaisseur */
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 
      inset 0 2px 4px rgba(255, 255, 255, 0.25), /* Lueur interne sur le bord haut */
      inset 0 -2px 6px rgba(0, 0, 0, 0.4);      /* Ombre interne en bas pour donner du relief */

    /* Reste des reflets... */
    &::before {
      content: "";
      position: absolute;
      inset: -1px;
      z-index: -1;
      background: conic-gradient(
        from var(--angle),
        transparent 70%,
        rgba(125, 211, 252, 0.3),
        rgba(255, 255, 255, 0.8),
        rgba(56, 189, 248, 0.5),
        transparent 95%
      );
      border-radius: 19px;
      animation: spin 4s linear infinite;

      -webkit-mask: 
        linear-gradient(#fff 0 0) content-box, 
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      padding: 1px;
    }
  }

  /* Reflet lumineux haut (effet néon) */
  .card::after {
    content: "";
    position: absolute;
    top: 0;
    left: 10%;
    right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.9), transparent);
    box-shadow: 
      0 0 10px 1px rgba(255, 255, 255, 0.8),
      0 0 20px 2px rgba(125, 211, 252, 0.6);
    border-radius: 50%;
    z-index: 2;
  }

  /* Reflet lumineux bas (effet néon) */
  .card .reflection-bottom {
    position: absolute;
    bottom: 0;
    left: 10%;
    right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.9), transparent);
    box-shadow: 
      0 0 10px 1px rgba(255, 255, 255, 0.8),
      0 0 20px 2px rgba(125, 211, 252, 0.6);
    border-radius: 50%;
    pointer-events: none;
    z-index: 2;
  }

  /* Styles des textes inchangés */
  .jp { font-family: 'Noto Sans JP', sans-serif; }
  .reading { font-size: 0.875rem; color: #8B949E; margin-bottom: 4px; }
  .word { font-size: 2.5rem; font-weight: 700; line-height: 1.15; color: #fff; margin-bottom: 4px; }
  .romaji { font-size: 0.8125rem; color: #8B949E; margin-bottom: 14px; font-style: italic; }
  .type-badge {
    display: inline-block; font-size: 0.625rem; font-weight: 700; padding: 5px 14px;
    border-radius: 20px; background: rgba(0, 229, 255, 0.1); color: #00E5FF;
    border: 1px solid rgba(0, 229, 255, 0.3); letter-spacing: 0.5px;
  }
  .speak-btn {
    position: absolute; top: 14px; right: 14px; width: 34px; height: 34px;
    border-radius: 50%; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; font-size: 0.95rem; cursor: pointer;
  }

  @keyframes spin {
    to { --angle: 360deg; }
  }
</style>
