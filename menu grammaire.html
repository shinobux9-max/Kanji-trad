<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Grammaire N5 - Glassmorphism</title>
  <style>
    @property --angle {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: false;
    }

    body {
      background: #060B18;
      color: #F0F6FC;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      font-family: 'Inter', sans-serif;
      padding: 20px;
      overflow-x: hidden;
      
      /* Intégration de ton image de fond */
      background-image: url('niveaux-bg.webp');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    /* En-tête de la page */
    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0 0 4px 0;
      color: #fff;
    }

    .header p {
      font-size: 0.8rem;
      color: #8B949E;
      margin: 0;
    }

    /* Conteneur global de la liste */
    .lessons-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Style exact des box */
    .unit-box-header, .vocab-category-header {
      position: relative;
      height: 54px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 15px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.16), transparent 70%),
        linear-gradient(135deg, rgba(15,25,45,0.4), rgba(5,10,20,0.6));
      backdrop-filter: blur(6px) saturate(150%);
      -webkit-backdrop-filter: blur(6px) saturate(150%);
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow:
        inset 0 2px 4px rgba(255,255,255,0.2),
        inset 0 -2px 6px rgba(0,0,0,0.35);
    }

    .unit-box-header::before, .vocab-category-header::before {
      content: "";
      position: absolute;
      inset: -1px -1px 0 -1px;
      z-index: -1;
      background: conic-gradient(
        from var(--angle),
        transparent 70%,
        rgba(125,211,252,0.3),
        rgba(255,255,255,0.8),
        rgba(56,189,248,0.5),
        transparent 95%
      );
      border-radius: 15px 15px 0 0;
      animation: glassBorderSpin 4s linear infinite;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      padding: 1px;
    }

    .unit-box-header::after, .vocab-category-header::after {
      content: "";
      position: absolute;
      top: 0; left: 10%; right: 0%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
      box-shadow: 0 0 10px 1px rgba(255,255,255,0.8), 0 0 20px 2px rgba(125,211,252,0.6);
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
    }

    .glass-reflect-bottom {
      position: absolute;
      bottom: 0; left: 0%; right: 30%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
      box-shadow: 0 0 10px 1px rgba(255,255,255,0.8), 0 0 20px 2px rgba(125,211,252,0.6);
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
    }

    @keyframes glassBorderSpin {
      to { --angle: 360deg; }
    }

    /* Éléments internes de test */
    .lesson-info {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #38BDF8;
      letter-spacing: 0.3px;
    }

    .lesson-progress {
      font-size: 0.8rem;
      color: #8B949E;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Grammaire N5</h1>
    <p>75 leçons · 0 maîtrisées</p>
  </div>

  <div class="lessons-container">
    <!-- Leçon 1 -->
    <div class="unit-box-header">
      <div class="lesson-info">
        <span>▶</span> 1 - LES BASES DE LA PHRASE
      </div>
      <div class="lesson-progress">0/7</div>
      <div class="glass-reflect-bottom"></div>
    </div>

    <!-- Leçon 2 -->
    <div class="unit-box-header">
      <div class="lesson-info">
        <span>▶</span> 2 - LES PARTICULES FONDAMENTALES
      </div>
      <div class="lesson-progress">0/12</div>
      <div class="glass-reflect-bottom"></div>
    </div>

    <!-- Leçon 3 -->
    <div class="unit-box-header">
      <div class="lesson-info">
        <span>▶</span> 3 - ORIGINE, LIMITES ET COMPARAISONS
      </div>
      <div class="lesson-progress">0/8</div>
      <div class="glass-reflect-bottom"></div>
    </div>
  </div>

</body>
</html>
