<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Grammaire N5</title>
  <style>
    @property --angle {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: false;
    }

    body {
      background: #060B18;
      color: #F0F6FC;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      
      background-image: url('niveaux-bg.webp');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    /* Grand bandeau supérieur sur toute la largeur avec ton fond dégradé */
    .page-header {
      width: 100%;
      padding: 16px 20px 24px 20px;
      box-sizing: border-box;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.16), transparent 70%),
        linear-gradient(135deg, rgba(15,25,45,0.4), rgba(5,10,20,0.6));
      backdrop-filter: blur(6px) saturate(150%);
      -webkit-backdrop-filter: blur(6px) saturate(150%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: inset 0 -2px 6px rgba(0,0,0,0.35);
      margin-bottom: 20px;
    }

    .header-content {
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      position: relative;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
      backdrop-filter: blur(6px);
      flex-shrink: 0;
    }

    .header-titles {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
    }

    .header-titles h1 {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 0;
      color: #fff;
    }

    .header-titles p {
      font-size: 0.75rem;
      color: #8B949E;
      margin: 4px 0 0 0;
    }

    /* Conteneur principal */
    .main-container {
      width: 100%;
      max-width: 420px;
      padding: 0 16px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Bouton Sélectionner */
    .select-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #F0F6FC;
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 0.8rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      align-self: flex-start;
    }

    /* Liste des leçons */
    .lessons-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Style exact de tes box de leçons */
    .unit-box-header {
      position: relative;
      height: 54px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 15px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.16), transparent 70%),
        linear-gradient(135deg, rgba(15,25,45,0.4), rgba(5,10,20,0.6));
      backdrop-filter: blur(6px) saturate(150%);
      -webkit-backdrop-filter: blur(6px) saturate(150%);
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow:
        inset 0 2px 4px rgba(255,255,255,0.2),
        inset 0 -2px 6px rgba(0,0,0,0.35);
    }

    .unit-box-header::before {
      content: "";
      position: absolute;
      inset: -1px -1px 0 -1px;
      z-index: -1;
      background: conic-gradient(
        from var(--angle),
        transparent 70%,
        rgba(125,211,252,0.3),
        rgba(255,255,255,0.8),
        rgba(56,189,248,0.5),
        transparent 95%
      );
      border-radius: 15px 15px 0 0;
      animation: glassBorderSpin 4s linear infinite;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      padding: 1px;
    }

    .unit-box-header::after {
      content: "";
      position: absolute;
      top: 0; left: 10%; right: 10%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
      box-shadow: 0 0 10px 1px rgba(255,255,255,0.8), 0 0 20px 2px rgba(125,211,252,0.6);
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
    }

    .glass-reflect-bottom {
      position: absolute;
      bottom: 0; left: 10%; right: 10%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
      box-shadow: 0 0 10px 1px rgba(255,255,255,0.8), 0 0 20px 2px rgba(125,211,252,0.6);
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
    }

    @keyframes glassBorderSpin {
      to { --angle: 360deg; }
    }

    .lesson-info {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #38BDF8;
      letter-spacing: 0.3px;
    }

    .lesson-progress {
      font-size: 0.8rem;
      color: #8B949E;
    }
  </style>
</head>
<body>

  <!-- Grand bandeau supérieur sur toute la largeur avec le fond dégradé -->
  <div class="page-header">
    <div class="header-content">
      <div class="back-btn">←</div>
      <div class="header-titles">
        <h1>Grammaire N5</h1>
        <p>75 leçons · 0 maîtrisées</p>
      </div>
    </div>
  </div>

  <!-- Contenu principal -->
  <div class="main-container">
    <div class="select-btn">
      ☑ Sélectionner
    </div>

    <div class="lessons-container">
      <div class="unit-box-header">
        <div class="lesson-info"><span>▶</span> 1 - LES BASES DE LA PHRASE</div>
        <div class="lesson-progress">0/7</div>
        <div class="glass-reflect-bottom"></div>
      </div>

      <div class="unit-box-header">
        <div class="lesson-info"><span>▶</span> 2 - LES PARTICULES FONDAMENTALES</div>
        <div class="lesson-progress">0/12</div>
        <div class="glass-reflect-bottom"></div>
      </div>

      <div class="unit-box-header">
        <div class="lesson-info"><span>▶</span> 3 - ORIGINE, LIMITES ET COMPARAISONS</div>
        <div class="lesson-progress">0/8</div>
        <div class="glass-reflect-bottom"></div>
      </div>
    </div>
  </div>

</body>
</html>
